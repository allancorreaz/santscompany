<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Sants Company</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.2.4">
  <link rel="stylesheet" href="../assets/css/blog.css?v=1.2.4">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=optional" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=optional"></noscript>
</head>
<body data-page="blog">
  <div class="global-header"></div>

  <main>
    <section class="blog-section">
      <div class="container">
        <!-- Bloco de boas-vindas removido para design mais limpo -->
        <div id="blogWelcome" class="blog-welcome"></div>
        <div class="blog-filter-bar">
          <label class="blog-filter-field" for="blogSearchInput">
            <span>Buscar por título</span>
            <input id="blogSearchInput" type="search" placeholder="Digite o título do post" autocomplete="off">
          </label>
          <label class="blog-filter-field" for="blogCategoryFilter">
            <span>Filtrar por categoria</span>
            <select id="blogCategoryFilter">
              <option value="">Todas as categorias</option>
            </select>
          </label>
        </div>
        <div id="blogList" class="blog-list"></div>
      </div>
    </section>

  </main>

  <div class="global-footer"></div>

  <script src="../assets/js/site-config.js?v=1.2.4" defer></script>
  <script src="../assets/js/components.js?v=1.2.4" defer></script>
  <script src="../assets/js/main.js?v=1.2.4" defer></script>
  <script src="../assets/js/blog-list.js?v=1.2.4" defer></script>
  <script src="../assets/js/forms.js?v=1.2.4" defer></script>
</body>
</html>
