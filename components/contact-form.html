<section class="section">
    <div class="container contact-page-grid">
    <aside class="content-card reveal">
      <h3>Quer conversar sobre um projeto?</h3>
      <p>
        Descreva o que sua empresa precisa. Respondemos pelo canal informado e alinhamos o melhor próximo passo para o projeto.
      </p>

      <div class="contact-list">
        <div class="contact-item">
          <i class="fas fa-phone"></i>
          <a href="tel:+5521999114096">+55 21 99911-4096</a>
        </div>

        <div class="contact-item">
          <i class="fas fa-envelope"></i>
          <a href="mailto:contato@santscompany.com">contato@santscompany.com</a>
        </div>

        <div class="contact-item">
          <i class="fab fa-whatsapp"></i>
          <a href="https://wa.me/5521999114096?text=Olá,%20vim%20pelo%20site%20e%20quero%20aumentar%20meus%20clientes." target="_blank" rel="noopener">
            Atendimento via WhatsApp
          </a>
        </div>
      </div>
    </aside>

    <div class="content-card reveal">
      <form class="contact-form reveal" id="contactForm" autocomplete="off" data-recaptcha-sitekey="{{RECAPTCHA_SITE_KEY}}">
        <input type="text" name="name" placeholder="Seu nome" required autocomplete="off">

        <input type="email" name="email" placeholder="Seu e-mail" required autocomplete="off">

        <input
          type="tel"
          name="phone"
          id="phone"
          placeholder="(21) 99911-4096"
          autocomplete="off"
          style="border-radius: 10px; border: 1.5px solid #e5e7eb; padding: 12px;"
        >

        <div class="custom-select-wrapper">
          <select name="serviceType" id="serviceType" required multiple class="form-select-multi">
            <option value="Desenvolvimento Web">Desenvolvimento Web</option>
            <option value="Trafego Pago & SEO">Trafego Pago & SEO</option>
            <option value="Social Media">Social Media</option>
            <option value="Marketing Digital">Marketing Digital</option>
            <option value="Web Designer">Web Designer</option>
            <option value="Outro">Outro</option>
          </select>
        </div>

        <div id="otherServiceContainer" style="display:none; margin-top:10px;">
          <input
            type="text"
            name="otherService"
            id="otherServiceInput"
            placeholder="Outro qual?"
            autocomplete="off"
            class="form-input"
          >
        </div>

        <input type="text" name="company" class="hp-field" tabindex="-1" aria-hidden="true" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">

        <textarea name="message" placeholder="Conte sobre seu projeto ou objetivo..." required autocomplete="off"></textarea>

        <p class="form-privacy">Ao submeter este formulário, aceito a Política de Privacidade deste site.</p>

        <button type="submit" class="btn-primary btn-submit" id="submitBtn">
          <i class="fas fa-paper-plane"></i> Enviar mensagem
        </button>
      </form>
    </div>
  </div>
</section>
